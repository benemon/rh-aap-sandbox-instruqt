version: "3"
containers:
- name: packages
  image: quay.io/benjamin_holmes/rh-aap-sandbox-instruqt:latest
  shell: /bin/bash
  environment:

  memory: 256
virtualmachines:
- name: controller
  image: rhel-cloud/rhel-9
  shell: /bin/bash
  machine_type: n2d-standard-8
  allow_external_ingress:
  - http
  - https
  - high-ports
  provision_ssl_certificate: true
- name: hub
  image: rhel-cloud/rhel-9
  shell: /bin/bash
  machine_type: n2-standard-8
  allow_external_ingress:
  - http
  - https
  - high-ports
  provision_ssl_certificate: true
- name: eda
  image: rhel-cloud/rhel-9
  shell: /bin/bash
  machine_type: n2-standard-8
  allow_external_ingress:
  - http
  - https
  - high-ports
  provision_ssl_certificate: true
- name: gateway
  image: rhel-cloud/rhel-9
  shell: /bin/bash
  machine_type: n2-standard-8
  allow_external_ingress:
  - http
  - https
  - high-ports
  provision_ssl_certificate: true
- name: postgres
  image: rhel-cloud/rhel-9
  shell: /bin/bash
  machine_type: n2-standard-4
- name: bastion
  image: rhel-cloud/rhel-9
  shell: /bin/bash
  environment:
    AAP_RUN_INSTALLER: "true"
  machine_type: n2-standard-4
